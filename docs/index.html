<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECMWF AIFS-single 500hPa Z & 850hPa T</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#111;
    color:#eee;
    text-align:center;
    margin:0;
    padding:20px;
}

h2{
    margin-bottom:20px;
}

label{
    font-size:1.1rem;
    margin-right:8px;
}

select{
    font-size:1rem;
    padding:6px 10px;
    margin-bottom:15px;
}

img{
    max-width:95%;
    height:auto;
    border:1px solid #555;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}
</style>

</head>

<body>

<h2>
ECMWF AIFS-single 500 hPa Geopotential Height & 850 hPa Temperature
</h2>

<p>
Automatically updated from the latest ECMWF AIFS-single forecast.
</p>

<label for="step">Forecast Hour:</label>

<select id="step" onchange="update()">
</select>

<div>
    <img id="chart" src="" alt="Forecast Chart">
</div>


<script>

const select = document.getElementById("step");

// FT006～FT240 を6時間間隔で生成
for(let ft=6; ft<=240; ft+=6){

    const hh = String(ft).padStart(3,"0");

    const option = document.createElement("option");
    option.value = hh;
    option.textContent = `FT${hh}`;

    select.appendChild(option);
}


// 初期表示
select.value = "006";


function update(){

    const step = select.value;

    document.getElementById("chart").src =
        `output/latest_${step}.png?t=${Date.now()}`;

}


// ================================
// PC：左右矢印キー
// ================================

function changeStep(diff){

    let index = select.selectedIndex + diff;

    if(index < 0){
        index = 0;
    }

    if(index >= select.options.length){
        index = select.options.length - 1;
    }

    select.selectedIndex = index;
    update();
}


document.addEventListener("keydown", function(e){

    if(e.key === "ArrowLeft"){
        e.preventDefault();
        changeStep(-1);
    }

    if(e.key === "ArrowRight"){
        e.preventDefault();
        changeStep(1);
    }

});



// ================================
// スマホ：左右フリック
// ================================

let startX = 0;
let startY = 0;


document.addEventListener("touchstart", function(e){

    startX = e.changedTouches[0].clientX;
    startY = e.changedTouches[0].clientY;

}, {passive:true});


document.addEventListener("touchend", function(e){

    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;

    const dx = endX - startX;
    const dy = endY - startY;


    // 横方向のみ反応
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){


        if(dx < 0){
            // 左フリック → 次の時刻
            changeStep(1);
        }
        else{
            // 右フリック → 前の時刻
            changeStep(-1);
        }

    }

}, {passive:true});



// 初期画像表示
update();

</script>

</body>
</html>
